# Publishes Foliant packages to nuget.org via Trusted Publishing (OIDC — no stored API keys).
#
# ── ONE-BUTTON RELEASE — you never tag by hand ──────────────────────────────────────────────
#  1. Land the release on `main` via PR: a `## X.Y.Z — …` entry at the TOP of CHANGELOG.md, plus the code.
#  2. GitHub → Actions → "Release to nuget.org" → Run workflow → Branch: main, Version: X.Y.Z.
#
# The workflow VERIFIES the typed version equals the top CHANGELOG entry, builds, tests, and only then
# creates tag vX.Y.Z on main's HEAD itself (MinVer derives the package version from that tag) and publishes.
# A version that doesn't match the CHANGELOG, or a tag that already exists, FAILS before anything ships —
# exactly the "tagged the wrong commit / shipped old code" class of bug, now impossible.
# Pushing a tag by hand no longer publishes anything; releasing is only ever this button.
#
# Two release lines (ADR-0009 D1), chosen by the `package` input:
#  - main   : every packable Foliant package, version X.Y.Z, tag vX.Y.Z, CHANGELOG.md.
#  - docext : the experimental Foliant.DocumentExtraction package only, version X.Y.Z-preview.N,
#             tag docext-vX.Y.Z-preview.N, src/Foliant.DocumentExtraction/CHANGELOG.md. It depends on
#             the Foliant packages built from the same commit, so run it from a commit that carries a
#             main release tag (release main first); the workflow refuses otherwise.
#
# One-time setup (unchanged):
#  - nuget.org → Trusted Publishing policy: this repo + workflow file `release.yml`.
#  - repo secret NUGET_USER = your nuget.org profile name (NOT your email).

name: Release to nuget.org

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Release line: main (all Foliant packages) or docext (experimental adapter only)"
        required: true
        type: choice
        options: [main, docext]
        default: main
      version:
        description: "Version to publish: X.Y.Z for main, X.Y.Z-preview.N for docext — must equal the top entry of that line's CHANGELOG"
        required: true
        type: string
      dry_run:
        description: "Build, test and pack only — do NOT tag or publish (safe rehearsal)"
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Per-line settings; the steps below read only these, never the input directly.
      TAG: ${{ inputs.package == 'docext' && 'docext-v' || 'v' }}${{ inputs.version }}
      VERSION_PATTERN: ${{ inputs.package == 'docext' && '^[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$' || '^[0-9]+\.[0-9]+\.[0-9]+$' }}
      CHANGELOG: ${{ inputs.package == 'docext' && 'src/Foliant.DocumentExtraction/CHANGELOG.md' || 'CHANGELOG.md' }}
      PACK_TARGET: ${{ inputs.package == 'docext' && 'src/Foliant.DocumentExtraction/Foliant.DocumentExtraction.csproj' || 'Foliant.sln' }}
      PACK_DOCEXT: ${{ inputs.package == 'docext' && 'true' || 'false' }}
    permissions:
      id-token: write   # GitHub OIDC token for NuGet Trusted Publishing
      contents: write   # push the release tag + create the GitHub Release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer needs full history + tags to derive the version from the tag

      - name: Guard — must run from main
        run: |
          test "${GITHUB_REF}" = "refs/heads/main" \
            || { echo "::error::Run this workflow with Branch = main (got ${GITHUB_REF})."; exit 1; }

      - name: Guard — version matches the line's format and the TOP entry of its CHANGELOG
        env:
          VER: ${{ inputs.version }}
        run: |
          echo "$VER" | grep -Eq "$VERSION_PATTERN" \
            || { echo "::error::version '$VER' does not match $VERSION_PATTERN"; exit 1; }
          HEADING=$(grep -m1 -E '^## [0-9]+\.[0-9]+\.[0-9]+' "$CHANGELOG")
          if echo "$HEADING" | grep -qi 'unreleased'; then
            echo "::error::Top $CHANGELOG entry is marked unreleased: give it the release date first."; exit 1; fi
          TOP=$(echo "$HEADING" | sed -E 's/^## ([0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]+)?).*/\1/')
          echo "Top $CHANGELOG entry = '$TOP'   requested = '$VER'"
          test "$TOP" = "$VER" \
            || { echo "::error::Top $CHANGELOG entry is '$TOP', not '$VER'. Land the '## $VER' entry on main first."; exit 1; }

      - name: Guard — tag must not already exist (NuGet versions are immutable)
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG already exists — bump to the next version."; exit 1; fi

      # The adapter's Foliant dependencies take this commit's main version (see the post-pack guard),
      # which is a released version only on a commit tagged vX.Y.Z. Checked before tagging, so a
      # refused run never leaves a docext tag behind.
      - name: Guard — docext runs from a commit with a main release tag
        if: ${{ inputs.package == 'docext' }}
        run: |
          git describe --exact-match --match 'v[0-9]*' HEAD \
            || { echo "::error::HEAD has no vX.Y.Z tag: release main first, then docext from the same commit."; exit 1; }

      - name: Setup .NET (pinned by global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Foliant.sln -c Release

      # Same gate as ci.yml: never publish packages whose THIRD-PARTY-NOTICES.txt is stale.
      # (The pack target in src/Directory.Build.props checks it again.)
      - name: Third-party notices are up to date
        run: python3 scripts/generate-notices.py --check

      - name: Test
        run: dotnet test Foliant.sln -c Release --no-build

      # Tag only AFTER build + test pass, so a failing test never leaves a dangling tag.
      - name: Tag this commit (MinVer reads the tag → package version)
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Pack   # rebuilds with the tag's version stamped in
        run: dotnet pack "$PACK_TARGET" -c Release -o ./nupkgs -p:PackDocExt="$PACK_DOCEXT"

      # Backstop for the pre-tag check: the adapter's Foliant dependencies take the version MinVer
      # computes for this commit. Off a main release tag that is an unpublished prerelease (e.g.
      # 1.8.2-alpha.0.12) and the package could not be installed, so refuse unless every Foliant
      # dependency is a released version.
      - name: Guard — docext depends only on released Foliant packages
        if: ${{ inputs.package == 'docext' }}
        run: |
          DEPS=$(unzip -p nupkgs/Foliant.DocumentExtraction.*.nupkg '*.nuspec' \
                 | grep -oE 'id="Foliant\.[A-Za-z.]+" version="[^"]+"')
          echo "$DEPS"
          if echo "$DEPS" | grep -q 'version="[^"]*-'; then
            echo "::error::Foliant dependencies are prereleases: run docext from a commit tagged with a main release."; exit 1; fi
          test "$(find nupkgs -name '*.nupkg' | wc -l)" -eq 1 \
            || { echo "::error::docext must pack exactly one package"; ls nupkgs; exit 1; }

      - name: NuGet login (OIDC → temp API key)
        if: ${{ !inputs.dry_run }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0 (Apache-2.0)
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages
        if: ${{ !inputs.dry_run }}
        run: >
          dotnet nuget push "nupkgs/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ inputs.version }}
          PACKAGE: ${{ inputs.package }}
        run: |
          if [ "$PACKAGE" = docext ]; then
            gh release create "$TAG" --prerelease --title "Foliant.DocumentExtraction $VER" \
              --notes "See the $VER entry in $CHANGELOG."
          else
            gh release create "$TAG" --title "Foliant $VER" --notes "See the $VER entry in $CHANGELOG."
          fi
